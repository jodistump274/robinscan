[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinscan-arb"
version = "0.2.0"
description = "Scan and live-monitor Robinhood Chain blocks for closed-loop DEX arbitrage"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "jodistump274"}]
dependencies = []

[project.scripts]
robinscan-arb = "robinscan_arb:main"

[tool.setuptools]
py-modules = ["robinscan_arb"]
