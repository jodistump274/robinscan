name: sequencer-feed-smoke

on:
  push:
    branches:
      - codex/live-mode-test

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check websocket-client
      - name: Receive a Robinhood Chain sequencer feed message
        run: |
          python - <<'PY'
          import websocket

          connection = websocket.create_connection(
              "wss://feed.mainnet.chain.robinhood.com",
              timeout=30,
              suppress_origin=True,
          )
          try:
              message = connection.recv()
              if not message:
                  raise SystemExit("sequencer feed returned an empty message")
              print("received sequencer feed message:", type(message).__name__, len(message), "bytes")
          finally:
              connection.close()
          PY
