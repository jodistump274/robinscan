name: live-smoke

on:
  push:
    branches:
      - codex/live-mode-test

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Receive a Robinhood Chain sequencer feed message
        run: |
          python - <<'PY'
          from robinscan_arb import DEFAULT_FEED_URL, WebSocketConnection

          with WebSocketConnection.connect(DEFAULT_FEED_URL, timeout=30) as connection:
              if not connection.wait_for_update(30):
                  raise SystemExit("sequencer feed connected but no message arrived")
          print("dependency-free client received a live sequencer feed message")
          PY
