name: live-smoke

on:
  push:
    branches:
      - codex/live-mode-test

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Receive a real Robinscan WebSocket update
        run: |
          python - <<'PY'
          from robinscan_arb import RobinscanClient, RobinscanWebSocket

          client = RobinscanClient(timeout=20, retries=2)
          ticket = client.stream_ticket()
          with RobinscanWebSocket.connect(ticket, client.origin, timeout=20) as stream:
              if not stream.wait_for_update(30):
                  raise SystemExit("Robinscan WebSocket connected but no update arrived in 30 seconds")
          print("received a Robinscan live update frame")
          PY
